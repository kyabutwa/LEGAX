name: LegaX Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_API_ID || 'dc244234b7ff0a561d16a280e1c948db' }}
      DATABASE_URL: ${{ secrets.LEGAX_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Resolve Cloudflare account ID
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          ACCOUNT_ID="$(npx wrangler whoami --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const a=(j.accounts && j.accounts[0] && j.accounts[0].id) || j.account_id || j.accountId || "";if(!/^[a-f0-9]{32}$/.test(a)){process.exit(1)}process.stdout.write(a)})')"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy hardened Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.DATABASE_URL != '' }}
        run: |
          printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL --env production
          npx wrangler deploy src/worker.ts --env production

      - name: Verify production runtime
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.DATABASE_URL != '' }}
        run: |
          set -e
          BASE="https://legax.kyabutwabis-f.workers.dev"
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 "$BASE/api/health"
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 "$BASE/api/database/health"
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 "$BASE/"
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 "$BASE/join" | grep -q "Join as a Participant"
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 "$BASE/join" | grep -q "Join as a Provider"
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 "$BASE/account" | grep -q "Confirm password"
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 "$BASE/account" | grep -q "Forgot password"
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 "$BASE/account/recovery" | grep -q "Forgot your password"
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 "$BASE/people"
          echo "LegaX production runtime verification passed."

      - name: Database legacy runtime reference scan
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { neon } from "@neondatabase/serverless";
          const sql=neon(process.env.DATABASE_URL);
          const rows=await sql`SELECT n.nspname AS schema_name,p.proname AS function_name
            FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
            WHERE n.nspname='legax' AND (p.prosrc ILIKE '%legakeys.%' OR p.prosrc ILIKE '%LEGAKEYS_%')`;
          if(rows.length){console.error(rows);process.exit(1);}
          console.log("Database legacy runtime reference scan passed.");
          NODE

      - name: Report skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.DATABASE_URL == '' }}
        run: echo "::warning::Deployment skipped because required deployment secrets are not configured."
