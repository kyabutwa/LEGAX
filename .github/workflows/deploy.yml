name: LegaX Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_API_ID }}
      DATABASE_URL: ${{ secrets.LEGAX_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Resolve Cloudflare account ID
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          ACCOUNT_ID="$(npx wrangler whoami --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const a=(j.accounts && j.accounts[0] && j.accounts[0].id) || j.account_id || j.accountId || "";if(!/^[a-f0-9]{32}$/.test(a)){process.exit(1)}process.stdout.write(a)})')"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Resolved Cloudflare account identity from the authenticated Wrangler token."

      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.DATABASE_URL != '' }}
        run: |
          printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL --env production
          npx wrangler deploy --env production
      - name: Verify deployed Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.DATABASE_URL != '' }}
        run: |
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 https://legax.kyabutwabis-f.workers.dev/api/health
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 https://legax.kyabutwabis-f.workers.dev/api/database/health

      - name: Report deployment configuration
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.DATABASE_URL == '' }}
        run: echo "Cloudflare deployment skipped because required deployment secrets are not configured."
